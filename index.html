<!doctype html>
<html lang="ja">
<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>15MIN AI WORKOUT V2</title>
<style>
:root{--bg:#02070b;--panel:rgba(6,18,24,.54);--panel2:rgba(4,13,18,.72);--line:rgba(80,230,214,.38);--text:#f7fbfc;--muted:#aabac0;--accent:#4fe4d0;--accent2:#1fc7ff}
*{box-sizing:border-box}html,body{margin:0;background:#02070b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}button,input,select{font:inherit}
body{overflow-x:hidden}.app{max-width:720px;margin:auto;min-height:100vh;position:relative;overflow:hidden;background:#02070b}
.screen{display:none;min-height:100vh;position:relative;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));isolation:isolate}.screen.active{display:block}
.screen::before{content:"";position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,rgba(3,10,14,.26),rgba(2,7,11,.2) 42%,rgba(1,5,8,.9) 100%)}
.screen::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none}
#home{background:

linear-gradient(90deg,transparent 0 11%,rgba(111,244,240,.16) 12% 13%,transparent 14% 44%,rgba(111,244,240,.2) 45% 46%,transparent 47% 100%),
linear-gradient(180deg,transparent 0 61%,rgba(0,0,0,.2) 62% 100%),
radial-gradient(ellipse at 22% 67%,rgba(0,0,0,.95) 0 16%,transparent 17%),
radial-gradient(ellipse at 67% 71%,rgba(0,0,0,.92) 0 18%,transparent 19%)}

linear-gradient(180deg,transparent 0 69%,rgba(0,0,0,.48) 70% 100%),
radial-gradient(ellipse at 16% 77%,rgba(0,0,0,.78) 0 17%,transparent 18%),
radial-gradient(ellipse at 82% 74%,rgba(0,0,0,.65) 0 14%,transparent 15%)}
#rest{background:
radial-gradient(circle at 18% 12%,rgba(161,114,155,.24),transparent 28%),
radial-gradient(circle at 72% 22%,rgba(99,158,179,.16),transparent 28%),

#rest::after{background:
linear-gradient(90deg,transparent 0 8%,rgba(255,255,255,.08) 9% 10%,transparent 11% 36%,rgba(255,255,255,.05) 37% 38%,transparent 39%),
linear-gradient(180deg,transparent 0 67%,rgba(0,0,0,.35) 68% 100%)}
#finish{background:
radial-gradient(circle at 50% 32%,rgba(40,238,216,.16),transparent 28%),
radial-gradient(circle at 15% 15%,rgba(33,173,255,.16),transparent 18%),
linear-gradient(180deg,#031119 0%,#02090e 52%,#010508 100%)}
#finish::after{background:
radial-gradient(circle at 18% 20%,rgba(89,255,231,.8) 0 1px,transparent 2px),
radial-gradient(circle at 34% 12%,rgba(89,255,231,.7) 0 1px,transparent 2px),
radial-gradient(circle at 71% 18%,rgba(89,255,231,.65) 0 1px,transparent 2px),
radial-gradient(circle at 82% 34%,rgba(89,255,231,.6) 0 1px,transparent 2px),
radial-gradient(circle at 22% 48%,rgba(89,255,231,.55) 0 1px,transparent 2px);
background-size:140px 140px,180px 180px,220px 220px,160px 160px,200px 200px;animation:stars 10s linear infinite}
@keyframes stars{to{background-position:0 140px,0 180px,0 220px,0 160px,0 200px}}
#program,#settings,#records{background:linear-gradient(180deg,#07141a,#02070b)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:5}.topTitle{font-size:12px;font-weight:900;letter-spacing:.05em}.iconBtn{width:42px;height:42px;border:0;background:rgba(0,0,0,.18);color:white;font-size:27px;border-radius:50%}.menuBtn{font-size:22px}

.start{width:100%;min-height:58px;border-radius:999px;border:1px solid #56e6d7;background:linear-gradient(180deg,rgba(67,220,204,.44),rgba(20,93,91,.64));color:#fff;font-weight:950;font-size:17px;box-shadow:0 0 22px rgba(78,229,211,.18),inset 0 0 0 1px rgba(255,255,255,.05)}
.homeNav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.homeNav button{min-height:62px;border-radius:14px;border:1px solid var(--line);background:rgba(3,12,17,.68);color:white;font-weight:800}.homeNav span{display:block;font-size:21px;margin-bottom:4px}
.quote{margin-top:20px;min-height:42px;font-size:14px;color:#d6e4e7;line-height:1.45;text-shadow:0 2px 8px #000}.quote:before{content:"「";color:var(--accent)}.quote:after{content:"」";color:var(--accent)}
.rec{font-size:11px;color:var(--accent);margin-top:4px;font-weight:800}
.exerciseHead{text-align:center;margin-top:34px}.exercise{font-size:29px;font-weight:950;text-shadow:0 3px 18px #000}.muscle{font-size:13px;margin-top:5px;color:#d1dee2}
.ring{width:248px;height:248px;margin:24px auto 12px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) 0 33%,rgba(192,211,217,.32) 33% 100%);box-shadow:0 0 22px rgba(78,229,211,.1)}
.ring:before{content:"";position:absolute;inset:14px;border-radius:50%;background:rgba(2,8,12,.82);border:1px solid rgba(255,255,255,.05);backdrop-filter:blur(8px)}.ringIn{position:relative;z-index:2;text-align:center}.setLabel{font-size:13px;color:#d9e5e8}.rep{font-size:61px;font-weight:950;line-height:1;margin-top:7px}.unit{font-size:14px;color:#c3d1d5;margin-top:6px}
.metricGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:16px}.metric{min-height:88px;border-radius:16px;border:1px solid var(--line);background:rgba(5,15,20,.58);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;align-items:center}.metric b{font-size:22px}.metric span{font-size:11px;color:var(--muted);margin-top:4px}.metric.form{cursor:pointer}.metric.form b{font-size:23px;color:var(--accent)}
.complete{width:100%;min-height:52px;border:0;border-radius:16px;background:var(--accent);color:#03110e;font-weight:950;font-size:17px;margin-top:10px}
.restMain{text-align:center;margin-top:46px}.restMain h2{font-size:30px;margin:0}.restMain p{margin:8px 0 0;color:#d3e1e4}.restRing{width:254px;height:254px;margin:28px auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) 0 100%,rgba(255,255,255,.18) 100%)}.restRing:before{content:"";position:absolute;inset:15px;border-radius:50%;background:rgba(3,9,13,.72);backdrop-filter:blur(10px)}.restNum{position:relative;z-index:2;font-size:59px;font-weight:950;font-variant-numeric:tabular-nums}
.restActions{display:flex;justify-content:center;gap:32px;margin-top:22px}.roundAction{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:rgba(5,14,19,.58);color:white;font-size:28px}.roundLabel{font-size:11px;color:#d5e2e6;margin-top:6px}.actionWrap{text-align:center}
.finishWrap{text-align:center;margin-top:82px}.finishWrap h2{font-size:31px;margin:0}.finishWrap p{line-height:1.6;color:#d2e0e4}.stats{margin-top:24px;border:1px solid var(--line);border-radius:17px;background:rgba(5,14,19,.62);overflow:hidden}.stat{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid rgba(255,255,255,.06)}.stat:last-child{border-bottom:0}.stat b{font-size:17px}
.primary{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--accent);color:#03110e;font-weight:950;font-size:17px;margin-top:24px}.secondary{width:100%;min-height:50px;border-radius:999px;border:1px solid var(--line);background:rgba(5,15,20,.66);color:var(--accent);font-weight:900;margin-top:10px}
.pageTitle{font-size:28px;font-weight:950;margin:4px 0 0}.tiny{font-size:11px;letter-spacing:.18em;color:#c9dade;font-weight:900}.card{border-radius:18px;padding:16px;margin-top:12px;border:1px solid var(--line);background:rgba(5,15,20,.65);backdrop-filter:blur(12px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.mini{font-size:12px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.day{min-height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(6,17,23,.72);color:white;font-weight:900}.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.day.off{opacity:.35}
.settings label{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.07)}.toggle{appearance:none;width:50px;height:30px;border-radius:999px;background:#253541;position:relative}.toggle:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}.toggle:checked{background:var(--accent)}.toggle:checked:after{left:23px}
.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,4,7,.86);padding:22px;align-items:center;justify-content:center}.modal.show{display:flex}.modalCard{width:min(100%,520px);border:1px solid var(--line);border-radius:22px;background:#07151b;padding:18px}.formStage{height:290px;border-radius:18px;margin-top:14px;background:radial-gradient(circle at 50% 38%,rgba(80,230,214,.18),transparent 28%),linear-gradient(180deg,#10252e,#07131a);display:grid;place-items:center;overflow:hidden;position:relative}.man{width:100px;height:180px;position:relative;animation:bob 1.7s ease-in-out infinite alternate}.man .head{position:absolute;left:36px;top:0;width:28px;height:28px;border-radius:50%;background:#6ee7d3}.man .body{position:absolute;left:46px;top:28px;width:8px;height:80px;border-radius:20px;background:#6ee7d3;transform-origin:top}.man .arm1,.man .arm2,.man .leg1,.man .leg2{position:absolute;width:8px;border-radius:20px;background:#6ee7d3;transform-origin:top}.man .arm1{left:47px;top:38px;height:65px;transform:rotate(55deg)}.man .arm2{left:47px;top:38px;height:65px;transform:rotate(-55deg)}.man .leg1{left:46px;top:99px;height:75px;transform:rotate(18deg)}.man .leg2{left:46px;top:99px;height:75px;transform:rotate(-18deg)}@keyframes bob{to{transform:translateY(6px) rotate(2deg)}}.tips{margin-top:14px;font-size:13px;line-height:1.7;color:#d5e4e7}
@media(max-width:430px){.heroBrand .line1{font-size:43px}.heroBrand .line2{font-size:30px}.ring{width:228px;height:228px}.restRing{width:232px;height:232px}}

/* V2 title screen: exact-reference overlay */
#home{background:#02070b !important}
#home::before,#home::after{display:none !important}
#home .homeWrap{min-height:calc(100vh - 46px);position:relative;padding:0 !important;display:block !important}
#home .heroBrand{display:none !important}
#home .start{position:absolute;left:8.5%;right:8.5%;bottom:21.5%;height:8.2%;min-height:0;margin:0;border:0;background:transparent;color:transparent;box-shadow:none;z-index:5}
#home .homeNav{position:absolute;left:8.5%;right:8.5%;bottom:10.8%;height:9%;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;margin:0}
#home .homeNav button{min-height:0;border:0;background:transparent;color:transparent;padding:0}
#home .homeNav span{display:none}
#home .quote{position:absolute;left:15%;right:15%;bottom:1.1%;min-height:7.2%;margin:0;display:flex;align-items:center;justify-content:center;padding:4px 8px;background:linear-gradient(180deg,rgba(1,5,8,.86),rgba(1,5,8,.98));border-radius:10px;font-size:13px;color:#e5eef0;line-height:1.42;text-align:center}
#home .quote:before{content:"「";color:var(--accent)}#home .quote:after{content:"」";color:var(--accent)}
#home .rec{display:none}

#home{background:#02070b !important}
#home .refBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;display:block}
#home .homeWrap{z-index:2}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active"><img class="refBg" alt="" src="./title-reference.svg?v=6">
<div class="homeWrap">
<div class="heroBrand"><div class="line1">15MIN</div><div class="line2">AI WORKOUT</div><div class="tag">STRONGER THAN YESTERDAY.</div></div>
<button id="startBtn" class="start">START</button>
<div class="homeNav">
<button id="programBtn"><span>▱</span>プログラム</button>
<button id="settingsBtn"><span>⚙︎</span>設定</button>
<button id="recordBtn"><span>✓</span>記録</button>
</div>
<div id="quote" class="quote"></div><div id="recommend" class="rec"></div>
</div>
</section>

<section id="program" class="screen">
<div class="top"><button class="iconBtn back">‹</button><div><div class="tiny">PROGRAM</div><div class="pageTitle">DAYを選ぶ</div></div><div style="width:42px"></div></div>
<div id="days" class="days"></div><div id="programList"></div><button id="begin" class="primary" style="display:none">このDAYを開始</button>
</section>

<section id="settings" class="screen">
<div class="top"><button class="iconBtn back">‹</button><div><div class="tiny">SETTINGS</div><div class="pageTitle">設定</div></div><div style="width:42px"></div></div>
<div class="card settings">
<label><span><b>背景映像</b><br><span class="mini muted">V2用背景スタイル</span></span><input class="toggle" type="checkbox" checked disabled></label>
<label><span><b>低負荷モード</b><br><span class="mini muted">バッテリー節約</span></span><input id="lowPower" class="toggle" type="checkbox"></label>
<label><span><b>BGM</b><br><span class="mini muted">後から音源を追加可能</span></span><input id="bgmToggle" class="toggle" type="checkbox"></label>
<label><span><b>音声ガイド</b><br><span class="mini muted">種目・重量・回数を読み上げ</span></span><input id="voiceToggle" class="toggle" type="checkbox"></label>
<label><span><b>応援ボイス</b><br><span class="mini muted">短い応援を追加</span></span><input id="cheerToggle" class="toggle" type="checkbox"></label>
</div>
</section>

<section id="records" class="screen">
<div class="top"><button class="iconBtn back">‹</button><div><div class="tiny">RECORDS</div><div class="pageTitle">記録</div></div><div style="width:42px"></div></div><div id="recordList" class="card"></div>
</section>

<section id="workout" class="screen">
<div class="top"><button id="endBtn" class="iconBtn">‹</button><div class="topTitle">15MIN AI WORKOUT</div><div class="menuBtn">☰</div></div>
<div class="exerciseHead"><div id="exercise" class="exercise"></div><div id="muscle" class="muscle"></div></div>
<div id="ring" class="ring"><div class="ringIn"><div id="setLabel" class="setLabel"></div><div id="repNum" class="rep"></div><div id="repUnit" class="unit"></div></div></div>
<div class="metricGrid">
<div class="metric"><b id="weight"></b><span>重量</span></div>
<div class="metric"><b id="restHint">8回</b><span>休憩まで</span></div>
<div id="formBtn" class="metric form"><b>▣</b><span>フォーム確認</span></div>
</div>
<button id="doneSet" class="complete">このセット完了</button>
</section>

<section id="rest" class="screen">
<div class="top"><button class="iconBtn" style="visibility:hidden">‹</button><div class="topTitle">15MIN AI WORKOUT</div><div class="menuBtn">☰</div></div>
<div class="restMain"><h2>休憩中</h2><p>次のセットに備えましょう</p><div id="restRing" class="restRing"><div id="restNum" class="restNum">00:60</div></div><div id="restNext" class="muted"></div>
<div class="restActions">
<div class="actionWrap"><button id="pauseRest" class="roundAction">Ⅱ</button><div class="roundLabel">一時停止</div></div>
<div class="actionWrap"><button id="skipRest" class="roundAction">>|</button><div class="roundLabel">スキップ</div></div>
</div></div>
</section>

<section id="finish" class="screen">
<div class="top"><div style="width:42px"></div><div class="topTitle">15MIN AI WORKOUT</div><div style="width:42px"></div></div>
<div class="finishWrap"><h2>お疲れさまでした！</h2><p>今日も一歩、<br>理想の自分に近づきました。</p>
<div class="stats"><div class="stat"><span>◷ トレーニング時間</span><b id="finishTime">15:00</b></div><div class="stat"><span>♨ 完了したセット</span><b id="finishSets">0 set</b></div><div class="stat"><span>🏆 次回おすすめ</span><b id="finishNext">DAY2</b></div></div>
<button id="again" class="primary">もう一度やる</button><button id="homeBtn" class="secondary">ホームに戻る</button></div>
</section>
</div>

<div id="formModal" class="modal"><div class="modalCard"><div class="row"><div><div class="tiny">FORM GUIDE</div><b id="formTitle">フォーム確認</b></div><button id="closeForm" class="iconBtn">×</button></div><div class="formStage"><div class="man"><div class="head"></div><div class="body"></div><div class="arm1"></div><div class="arm2"></div><div class="leg1"></div><div class="leg2"></div></div></div><div id="tips" class="tips"></div></div></div>

<script>
const BASE={1:{t:'DAY1',s:'メニュー未設定',e:[]},2:{t:'DAY2｜背中＋二頭',s:'背中と腕を鍛える日',e:[{n:'ワンハンドロー',w:10,r:'左右12回',sets:3,m:'背中・二頭',tips:['背中を丸めすぎない','肘を腰の方向へ引く','反動を使わない']},{n:'リバースフライ',w:4,r:'15回',sets:3,m:'背中・肩後部',tips:['肩をすくめない','肩甲骨を意識する','勢いをつけない']},{n:'ダンベルカール',w:7,r:'12回',sets:3,m:'二頭',tips:['肘を固定する','肩を上げない','ゆっくり下ろす']}]},3:{t:'DAY3｜脚',s:'下半身を鍛える日',e:[{n:'ダンベルスクワット',w:10,r:'12回',sets:3,m:'脚・臀部',two:true,tips:['膝とつま先を同じ方向へ','背中を丸めない','かかとを浮かせない']},{n:'ブルガリアンスクワット',w:8.5,r:'左右10回',sets:3,m:'脚・臀部',two:true,tips:['前足で体を支える','膝が内側に入らない','上体を安定させる']},{n:'ルーマニアンデッドリフト',w:10,r:'12回',sets:2,m:'ハム・臀部',two:true,tips:['膝は軽く曲げる','お尻を後ろへ引く','背中をまっすぐ保つ']}]},4:{t:'DAY4',s:'メニュー未設定',e:[]},5:{t:'DAY5',s:'メニュー未設定',e:[]}};
const quotes=['継続は、最強の才能だ。','今日の15分が、未来を変える。','完璧より、継続。','昨日の自分を、少し超える。','迷ったら、まず1セット。','強さは、静かに積み上がる。','Better day. Everyday.'];
const state={day:2,ei:0,si:1,sets:0,main:900,mainTimer:null,rest:60,restTimer:null,paused:false,last:+(localStorage.getItem('v2last')||0),voice:localStorage.getItem('v2voice')!=='off',cheer:localStorage.getItem('v2cheer')!=='off'};
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
function configured(){return [1,2,3,4,5].filter(d=>BASE[d].e.length)}
function recDay(){const arr=configured();if(!arr.length)return 1;if(!state.last)return arr[0];for(let i=1;i<=5;i++){const d=((state.last-1+i)%5)+1;if(BASE[d].e.length)return d}return arr[0]}
function show(id){qa('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='home'){q('#quote').textContent=quotes[Math.floor(Math.random()*quotes.length)];q('#recommend').textContent='おすすめ：'+BASE[recDay()].t}if(id==='records')renderRecords()}
function renderProgram(day){const r=recDay();q('#days').innerHTML=[1,2,3,4,5].map(d=>'<button class="day '+(d===r?'on ':'')+(!BASE[d].e.length?'off':'')+'" data-d="'+d+'">DAY'+d+'</button>').join('');qa('.day').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(!BASE[d].e.length)return alert('DAY'+d+'はまだ未設定です。');state.day=d;renderProgram(d)});const x=day?BASE[day]:null;q('#programList').innerHTML=x?'<div class="card"><div class="row"><div><b>'+x.t+'</b><div class="mini muted">'+x.s+'</div></div><span class="pill">15分</span></div></div>'+x.e.map((e,i)=>'<div class="card"><b>'+(i+1)+'. '+e.n+'</b><div class="mini muted" style="margin-top:6px">'+e.w+'kg'+(e.two?' × 2':'')+' ／ '+e.r+' ／ '+e.sets+'セット</div></div>').join(''):'';q('#begin').style.display=x?'block':'none'}
function speak(t){if(!state.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.98;speechSynthesis.speak(u)}
function current(){return BASE[state.day].e[state.ei]}
function renderWorkout(){const e=current(),d=BASE[state.day];q('#exercise').textContent=e.n;q('#muscle').textContent=e.m;q('#setLabel').textContent=state.si+' / '+e.sets+' SET';q('#repNum').textContent=(e.r.match(/\d+/)||['12'])[0];q('#repUnit').textContent=e.r.includes('左右')?'左右回':'回';q('#weight').textContent=e.w+'kg';q('#restHint').textContent=(e.r.match(/\d+/)||['12'])[0]+'回';const p=Math.round(state.si/e.sets*100);q('#ring').style.background='conic-gradient(var(--accent) 0 '+p+'%,rgba(192,211,217,.32) '+p+'% 100%)'}
function startWorkout(){state.ei=0;state.si=1;state.sets=0;state.main=900;clearInterval(state.mainTimer);state.mainTimer=setInterval(()=>{state.main=Math.max(0,state.main-1);if(state.main===0)finish()},1000);renderWorkout();show('workout');const e=current();speak(e.n+'。'+e.w+'キロ。'+e.r+'。1セット目。')}
function completeSet(){const e=current();const logs=JSON.parse(localStorage.getItem('v2logs')||'[]');logs.push({ts:Date.now(),day:state.day,n:e.n,w:e.w,r:e.r,set:state.si});localStorage.setItem('v2logs',JSON.stringify(logs));state.sets++;if(state.si<e.sets)state.si++;else if(state.ei<BASE[state.day].e.length-1){state.ei++;state.si=1}else{return finish()}startRest()}
function startRest(){state.rest=60;state.paused=false;show('rest');q('#restNum').textContent='00:60';q('#restNext').textContent='次：'+current().n+' '+state.si+'セット目';clearInterval(state.restTimer);state.restTimer=setInterval(()=>{if(state.paused)return;state.rest--;q('#restNum').textContent='00:'+String(state.rest).padStart(2,'0');const p=state.rest/60*100;q('#restRing').style.background='conic-gradient(var(--accent) 0 '+p+'%,rgba(255,255,255,.18) '+p+'% 100%)';if(state.rest<=0){clearInterval(state.restTimer);show('workout');renderWorkout();speak('レスト終了。次のセットです。')}},1000)}
function finish(){clearInterval(state.mainTimer);clearInterval(state.restTimer);state.last=state.day;localStorage.setItem('v2last',state.day);q('#finishSets').textContent=state.sets+' set';q('#finishNext').textContent='DAY'+recDay();q('#finishTime').textContent=String(Math.floor((900-state.main)/60)).padStart(2,'0')+':'+String((900-state.main)%60).padStart(2,'0');show('finish');speak('お疲れさまでした。')}
function showForm(){const e=current();q('#formTitle').textContent=e.n;q('#tips').innerHTML=e.tips.map(x=>'・'+x).join('<br>');q('#formModal').classList.add('show')}
function renderRecords(){const logs=JSON.parse(localStorage.getItem('v2logs')||'[]');q('#recordList').innerHTML=logs.length?logs.slice(-20).reverse().map(l=>'<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)"><b>'+l.n+'</b><div class="mini muted">DAY'+l.day+'・'+l.w+'kg・'+l.r+'・SET'+l.set+'</div></div>').join(''):'<span class="muted">まだ記録はありません。</span>'}
q('#startBtn').onclick=()=>{state.day=recDay();startWorkout()};q('#programBtn').onclick=()=>{renderProgram(recDay());show('program')};q('#settingsBtn').onclick=()=>show('settings');q('#recordBtn').onclick=()=>show('records');qa('.back').forEach(b=>b.onclick=()=>show('home'));q('#begin').onclick=startWorkout;q('#doneSet').onclick=completeSet;q('#formBtn').onclick=showForm;q('#closeForm').onclick=()=>q('#formModal').classList.remove('show');q('#pauseRest').onclick=()=>{state.paused=!state.paused;q('#pauseRest').textContent=state.paused?'▶':'Ⅱ'};q('#skipRest').onclick=()=>{clearInterval(state.restTimer);show('workout');renderWorkout()};q('#endBtn').onclick=()=>{if(confirm('トレーニングを終了しますか？')){clearInterval(state.mainTimer);clearInterval(state.restTimer);show('home')}};q('#again').onclick=startWorkout;q('#homeBtn').onclick=()=>show('home');
q('#voiceToggle').checked=state.voice;q('#cheerToggle').checked=state.cheer;q('#bgmToggle').checked=false;q('#voiceToggle').onchange=e=>{state.voice=e.target.checked;localStorage.setItem('v2voice',state.voice?'on':'off')};q('#cheerToggle').onchange=e=>{state.cheer=e.target.checked;localStorage.setItem('v2cheer',state.cheer?'on':'off')};
show('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=5');
</script>
</body>
